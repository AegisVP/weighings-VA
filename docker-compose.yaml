services:
  postgres:
    image: postgres:18-alpine
    container_name: sql
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - graintrack-internal
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
      args:
        - API_PORT=${API_PORT:-80}
    container_name: api
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - CROSS_ENV=prod
    ports:
      - '${API_PORT}:${API_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - graintrack-internal
    restart: unless-stopped
    # volumes:
    #   - ./api:/app
    #   - ./public:/public

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data
    external: true

networks:
  graintrack-internal:
    name: graintrack-network
    driver: bridge
